# Default monitor rule (matches any output)
# Format: monitorrule=name:<pattern>,width:<w>,height:<h>,refresh:<hz>,x:<x>,y:<y>,scale:<s>,vrr:<0|1>
monitorrule=name:*,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.0,vrr:0
